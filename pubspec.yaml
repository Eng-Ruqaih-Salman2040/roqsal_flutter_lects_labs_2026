  intl: ^0.20.2
  fluttertoast: ^9.0.0
  math_expressions: ^3.1.0
  flutter_switch: ^0.3.2
  flutter_svg_provider: ^1.0.7
  google_fonts: ^6.3.3
  flutter_rating_bar: ^4.0.1
  image_picker: ^1.2.1
  gestures: ^1.0.0
  matrix_gesture_detector: ^0.2.0-nullsafety.1
  zoom_widget: ^2.0.1
  url_launcher: ^6.3.2
  csv: ^6.0.0
  font_awesome_flutter: ^10.12.0
  sqflite: ^2.4.2
